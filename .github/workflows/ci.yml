name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".codex/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - ".codex/**"
      - ".claude/**"
  # Runtime dependencies float within their declared ranges, so a nightly run
  # surfaces upstream releases that change behavior without blaming a PR.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  # The event name keeps a nightly run on main from cancelling a push run.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Validate GitHub Actions and shell syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          bash -n scripts/live-aikit-agent-e2e.sh
          bash -n scripts/aikit-e2e-common.sh
          shellcheck -x scripts/live-aikit-agent-e2e.sh scripts/aikit-e2e-common.sh
          bash -n scripts/orka-harness-v2-e2e.sh
          shellcheck -x scripts/orka-harness-v2-e2e.sh
          bash -n scripts/parity-container-smoke.sh
          shellcheck scripts/parity-container-smoke.sh
          bash -n scripts/generate-agentsessions-stubs.sh
          shellcheck scripts/generate-agentsessions-stubs.sh
          bash -n scripts/agentsessions-e2e.sh
          shellcheck scripts/agentsessions-e2e.sh
          test -z "$(gofmt -l test/agentsessions/*.go)"
          test -z "$(gofmt -l test/orka-harness-v2/probe/*.go)"
          go test test/orka-harness-v2/probe/localai.go test/orka-harness-v2/probe/localai_test.go
          for script in \
            deploy/foundry/doctor.sh \
            deploy/foundry/toolbox/setup.sh \
            deploy/foundry/search/setup.sh \
            deploy/foundry/memory/setup.sh \
            deploy/foundry/rbac/assign-agent-identity.sh \
            deploy/foundry/scripts/invoke_responses.sh \
            deploy/foundry/scripts/foundry_brokered_conformance.sh \
            deploy/foundry/scripts/local_brokered_conformance_container.sh; do
            bash -n "$script"
          done
          python3 -m py_compile test/foundry-hosted-agent/foundry_live.py deploy/foundry/scripts/verify_brokered_transcript.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          bad = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for lineno, line in enumerate(path.read_text().splitlines(), start=1):
                  match = re.match(r'^\s*uses:\s*([^#\s]+)', line)
                  if not match:
                      continue
                  ref = match.group(1).strip('"\'')
                  if ref.startswith('./'):
                      continue
                  if ref.startswith('docker://'):
                      ok = re.fullmatch(r'docker://[^@]+@sha256:[0-9a-fA-F]{64}', ref) is not None
                  else:
                      ok = re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', ref) is not None
                  if not ok:
                      bad.append(f'{path}:{lineno}: {ref}')

          if bad:
              print('GitHub Actions uses: references must be pinned to immutable digests/full commit SHAs:', file=sys.stderr)
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" version

      - name: Check Go formatting
        run: golangci-lint fmt --diff

      - name: Lint Go
        run: make lint

      - name: Vet Go
        run: go vet ./...

      - name: Test Go with race detector
        run: make test

      - name: Build frontend binary
        run: go build -o /tmp/agentkit-frontend ./cmd/frontend

  python:
    name: Python checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: common
            path: runtimes/common
          - package: pydantic-ai adapter
            path: runtimes/pydantic-ai
          - package: microsoft-agent-framework adapter
            path: runtimes/microsoft-agent-framework
          - package: langgraph adapter
            path: runtimes/langgraph
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install package and test dependencies
        working-directory: ${{ matrix.path }}
        run: |
          set -euxo pipefail
          uv venv --python 3.12 .venv
          if [ "${{ matrix.path }}" != "runtimes/common" ]; then
            uv pip install --python .venv/bin/python -e ../common
          fi
          prerelease_args=()
          if [ "${{ matrix.path }}" = "runtimes/microsoft-agent-framework" ]; then
            # The Azure AI Search MAF adapter is currently published as a beta
            # package and depends on a beta azure-search-documents build.
            prerelease_args+=(--prerelease=allow)
          fi
          uv pip install --python .venv/bin/python "${prerelease_args[@]}" -e ".[dev]" build


      - name: Setup Go for common wire interoperability
        if: matrix.path == 'runtimes/common'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/agentsessions/go.mod
          cache-dependency-path: test/agentsessions/go.sum

      - name: Check pinned agentsessions stubs
        if: matrix.path == 'runtimes/common'
        run: scripts/generate-agentsessions-stubs.sh --check

      - name: Validate Foundry helper rendering
        if: matrix.path == 'runtimes/common'
        run: |
          set -euxo pipefail
          python3 -m py_compile deploy/foundry/render_agent.py test/foundry-hosted-agent/foundry_live.py
          runtimes/common/.venv/bin/python deploy/foundry/render_agent.py deploy/foundry/agentkit.foundry.yaml.example >/tmp/agentkit-foundry-agent.yaml
          grep -q '^environment_variables:' /tmp/agentkit-foundry-agent.yaml

      - name: Compile Python modules
        working-directory: ${{ matrix.path }}
        run: |
          set -euxo pipefail
          targets=()
          if [ -d agentkit_serve ]; then
            targets+=(agentkit_serve)
          fi
          if [ -d agentkit_serve_common ]; then
            targets+=(agentkit_serve_common)
          fi
          if [ -d ../common/agentkit_serve_common ]; then
            targets+=(../common/agentkit_serve_common)
          fi
          .venv/bin/python -m compileall "${targets[@]}"

      - name: Run Python tests
        working-directory: ${{ matrix.path }}
        run: |
          set -euxo pipefail
          if [ -d tests ]; then
            .venv/bin/python -m pytest -q
          else
            echo "No package-local tests for ${{ matrix.package }}; compile and wheel checks cover it."
          fi

      - name: Build Python wheel
        working-directory: ${{ matrix.path }}
        run: .venv/bin/python -m build --wheel

  # Images and the job above install the newest releases in each declared range;
  # this proves the declared lower bounds still work, parity suite included.
  python-lowest:
    name: Python lowest dependencies (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: common
            path: runtimes/common
          - package: pydantic-ai adapter
            path: runtimes/pydantic-ai
          - package: microsoft-agent-framework adapter
            path: runtimes/microsoft-agent-framework
          - package: langgraph adapter
            path: runtimes/langgraph
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Setup Go for common wire interoperability
        if: matrix.path == 'runtimes/common'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/agentsessions/go.mod
          cache-dependency-path: test/agentsessions/go.sum

      - name: Install lowest declared direct dependencies
        working-directory: ${{ matrix.path }}
        run: |
          set -euxo pipefail
          uv venv --python 3.12 .venv
          # One resolution, so the shared core's own lower bounds apply too.
          packages=()
          if [ "${{ matrix.path }}" != "runtimes/common" ]; then
            packages+=(-e ../common)
          fi
          prerelease_args=()
          if [ "${{ matrix.path }}" = "runtimes/microsoft-agent-framework" ]; then
            prerelease_args+=(--prerelease=allow)
          fi
          uv pip install --python .venv/bin/python --resolution lowest-direct \
            "${prerelease_args[@]}" "${packages[@]}" -e ".[dev]"
          uv pip list --python .venv/bin/python

      - name: Run Python tests
        working-directory: ${{ matrix.path }}
        run: .venv/bin/python -m pytest -q

  container-build:
    name: Container build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space for Docker-heavy checks
        run: |
          set -euxo pipefail
          echo "Disk usage before cleanup"
          df -h
          docker system df || true

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift

          docker system prune -af || true
          docker builder prune -af || true

          echo "Disk usage after cleanup"
          df -h
          docker system df || true

      - name: Setup Docker daemon with containerd image store
        uses: docker/setup-docker-action@e61617a16c407a86262fb923c35a616ddbe070b3 # v4.6.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Configure Docker Buildx daemon builder
        run: |
          docker buildx version
          docker buildx inspect --bootstrap
          echo "BUILDER=" >> "$GITHUB_ENV"

      - name: Build AgentKit frontend and runtime adapters
        run: |
          set -euxo pipefail
          make build-agentkit TAG=ci
          make build-serve TAG=ci
          make build-serve-maf TAG=ci
          make build-serve-langgraph TAG=ci

      - name: Build test agent images for all runtimes
        run: |
          set -euxo pipefail
          make build-test-agent TAG=ci BUILDER=
          make build-test-agent TAG=ci BUILDER= RUNTIME=maf
          make build-test-agent TAG=ci BUILDER= RUNTIME=langgraph

      - name: Smoke test built agent images
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f \
              agentkit-smoke-pydantic \
              agentkit-smoke-maf \
              agentkit-smoke-langgraph \
              agentkit-smoke-orka >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          smoke() {
            local name="$1"
            local image="$2"
            local port="$3"

            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" \
              --platform linux/amd64 \
              -p "127.0.0.1:${port}:8080" \
              -e AGENTKIT_BIND=0.0.0.0 \
              -e AGENTKIT_AUTH_TOKEN=ci-smoke-token \
              -e OPENAI_API_KEY=ci-dummy-key \
              "$image"

            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
                docker logs "$name"
                return 0
              fi
              sleep 1
            done

            docker logs "$name" || true
            return 1
          }

          orka_smoke() {
            local name="$1"
            local image="$2"
            local port="$3"

            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" \
              --platform linux/amd64 \
              -p "127.0.0.1:${port}:8080" \
              -e AGENTKIT_PROTOCOL=orka \
              -e AGENTKIT_BIND=0.0.0.0 \
              -e AGENTKIT_AUTH_TOKEN=ci-smoke-token \
              "$image"

            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/v1/health" >/tmp/orka-health.json; then
                break
              fi
              sleep 1
            done

            curl -fsS "http://127.0.0.1:${port}/v1/capabilities" >/tmp/orka-capabilities.json
            python3 - <<'PY'
          import json

          health = json.load(open('/tmp/orka-health.json'))
          assert health['version'] == 'orka.harness.v1'
          assert health['status'] == 'ok'
          assert health['ready'] is True
          assert 'checkedAt' in health

          capabilities = json.load(open('/tmp/orka-capabilities.json'))
          assert capabilities['protocolVersion'] == 'orka.harness.v1'
          assert capabilities['transport'] == 'http+sse'
          assert capabilities['runtimeName'] == 'agentkit-serve'
          assert capabilities['providerKind'] == 'kubernetes-service'
          assert capabilities['toolExecutionModes'] == ['observed']
          assert capabilities['maxConcurrentTurns'] == 1
          PY

            local unauth_status
            unauth_status=$(curl -sS -o /tmp/orka-unauth.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{}' \
              "http://127.0.0.1:${port}/v1/turns")
            test "$unauth_status" = "401"

            cat >/tmp/orka-start-turn.json <<'JSON'
          {
            "version": "orka.harness.v1",
            "namespace": "ci",
            "taskName": "offline-smoke",
            "sessionName": "offline-smoke-session",
            "runtimeSessionID": "offline-smoke-runtime-session",
            "turnID": "offline-smoke-turn",
            "correlationID": "offline-smoke-correlation",
            "deadline": "2000-01-01T00:00:00Z",
            "authIdentity": {"subject": "system:ci"},
            "input": {"prompt": "offline smoke", "contextRefs": [], "env": []},
            "toolExecutionMode": "observed",
            "metadata": {"ci": "true"}
          }
          JSON
            curl -fsS \
              -H 'authorization: Bearer ci-smoke-token' \
              -H 'content-type: application/json' \
              -d @/tmp/orka-start-turn.json \
              "http://127.0.0.1:${port}/v1/turns" >/tmp/orka-start-response.json
            curl -fsS \
              -H 'authorization: Bearer ci-smoke-token' \
              "http://127.0.0.1:${port}/v1/turns/offline-smoke-turn/events" >/tmp/orka-events.sse
            python3 - <<'PY'
          import json

          start = json.load(open('/tmp/orka-start-response.json'))
          assert start == {
              'version': 'orka.harness.v1',
              'accepted': True,
              'runtimeSessionID': 'offline-smoke-runtime-session',
              'turnID': 'offline-smoke-turn',
              'correlationID': 'offline-smoke-correlation',
              'eventStreamPath': '/v1/turns/offline-smoke-turn/events',
          }

          frames = []
          for block in open('/tmp/orka-events.sse').read().strip().split('\n\n'):
              if not block:
                  continue
              data = [line.removeprefix('data: ') for line in block.splitlines() if line.startswith('data: ')]
              assert len(data) == 1, block
              frames.append(json.loads(data[0]))

          assert [frame['type'] for frame in frames] == ['TurnStarted', 'TurnFailed']
          terminal = frames[-1]
          assert terminal['version'] == 'orka.harness.v1'
          assert terminal['runtimeSessionID'] == 'offline-smoke-runtime-session'
          assert terminal['turnID'] == 'offline-smoke-turn'
          assert terminal['correlationID'] == 'offline-smoke-correlation'
          assert terminal['seq'] == 2
          assert 'createdAt' in terminal
          assert 'payload' not in terminal
          assert terminal['failed']['reason'] == 'DeadlineExceeded'
          assert terminal['error']['code'] == 'DeadlineExceeded'
          PY

            docker logs "$name"
          }

          smoke agentkit-smoke-pydantic hello-agent:ci 18080
          smoke agentkit-smoke-maf maf-agent:ci 18081
          smoke agentkit-smoke-langgraph langgraph-agent:ci 18082
          orka_smoke agentkit-smoke-orka hello-agent:ci 18083

      - name: Setup Go for agentsessions replay proof
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/agentsessions/go.mod
          cache-dependency-path: test/agentsessions/go.sum

      - name: Prove keyless agentsessions journal and replay
        run: |
          set -euo pipefail
          # Keep runtime rows separate from commands that may consume stdin.
          while read -r -u 3 runtime fixture image; do
            make build-test-agent TAG=ci BUILDER= RUNTIME="$runtime" \
              FIXTURE="test/agentsessions/$fixture" AGENT_IMAGE="$image"
            AGENTKIT_AGENTSESSIONS_IMAGE="$image" \
              scripts/agentsessions-e2e.sh --skip-build "$runtime"
            (cd test/agentsessions && \
              AGENTKIT_AGENTSESSIONS_IMAGE="$image" AGENTKIT_AGENTSESSIONS_RUNTIME="$runtime" \
              go test -v -count=1 -run '^TestRunner(SignalCleanup|RuntimeSelection)$' ./...)
          done 3<<'RUNTIMES'
          pydantic-ai Agentkitfile.yaml agentkit-agentsessions-text:ci
          microsoft-agent-framework Agentkitfile-maf.yaml agentkit-agentsessions-maf-text:ci
          langgraph Agentkitfile-langgraph.yaml agentkit-agentsessions-langgraph-text:ci
          RUNTIMES

      - name: Container parity smoke
        env:
          TAG: ci
          BUILDER: ""
          PLATFORM: linux/amd64
        run: bash scripts/parity-container-smoke.sh

  live-aikit-e2e:
    name: Live AIKit E2E (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        adapter: [pydantic-ai, microsoft-agent-framework, langgraph]
    env:
      PLATFORM: linux/amd64
      BUILDER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space for Docker-heavy live E2E
        run: |
          set -euxo pipefail
          echo "Disk usage before cleanup"
          df -h
          docker system df || true

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift

          docker system prune -af || true
          docker builder prune -af || true

          echo "Disk usage after cleanup"
          df -h
          docker system df || true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Docker daemon with containerd image store
        uses: docker/setup-docker-action@e61617a16c407a86262fb923c35a616ddbe070b3 # v4.6.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Configure Docker Buildx daemon builder
        run: |
          docker buildx version
          docker buildx inspect --bootstrap
          echo "BUILDER=" >> "$GITHUB_ENV"

      - name: Run live AIKit-backed AgentKit E2E
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: bash scripts/live-aikit-agent-e2e.sh "$ADAPTER"

  orka-v1-conformance:
    name: Orka harness v1 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned Orka revision
        id: orka
        run: |
          revision="$(cat test/orka-harness-v2/orka-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Orka
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: orka-agents/orka
          ref: ${{ steps.orka.outputs.revision }}
          path: orka
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: orka/go.mod
          cache-dependency-path: orka/go.sum

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Orka's suite starts this checkout's create_orka_app with uv and drives
      # observed and brokered turns through Orka's own harness client.
      - name: Run Orka's AgentKit conformance suite
        working-directory: orka
        env:
          AGENTKIT_SERVE_ROOT: ${{ github.workspace }}
        run: go test ./internal/harness/conformance -run 'TestExternalAgentKitServe' -count=1 -v

  orka-v2-offline:
    name: Harness v2 E2E (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        adapter: [pydantic-ai, microsoft-agent-framework, langgraph]
    env:
      PLATFORM: linux/amd64
      BUILDER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/orka-harness-v2/probe/go.mod
          cache: true

      - name: Setup Docker daemon with containerd image store
        uses: docker/setup-docker-action@e61617a16c407a86262fb923c35a616ddbe070b3 # v4.6.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Run deterministic composed harness v2 E2E
        timeout-minutes: 65
        env:
          ADAPTER: ${{ matrix.adapter }}
          ARTIFACT_DIR: ${{ runner.temp }}/agentkit-orka-v2-offline
        run: bash scripts/orka-harness-v2-e2e.sh offline "$ADAPTER"

      - name: Upload safe harness v2 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orka-v2-offline-${{ matrix.adapter }}
          path: ${{ runner.temp }}/agentkit-orka-v2-offline
          if-no-files-found: warn
          retention-days: 7

  orka-v2-live:
    name: Live AIKit harness v2 E2E (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        adapter: [pydantic-ai, microsoft-agent-framework, langgraph]
    env:
      PLATFORM: linux/amd64
      BUILDER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/orka-harness-v2/probe/go.mod
          cache: true

      - name: Setup Docker daemon with containerd image store
        uses: docker/setup-docker-action@e61617a16c407a86262fb923c35a616ddbe070b3 # v4.6.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Run live composed harness v2 E2E
        timeout-minutes: 65
        env:
          ADAPTER: ${{ matrix.adapter }}
          ARTIFACT_DIR: ${{ runner.temp }}/agentkit-orka-v2-live
        run: bash scripts/orka-harness-v2-e2e.sh live "$ADAPTER"

      - name: Upload safe live harness v2 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orka-v2-live-${{ matrix.adapter }}
          path: ${{ runner.temp }}/agentkit-orka-v2-live
          if-no-files-found: warn
          retention-days: 7
