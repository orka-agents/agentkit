[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkit-serve-common"
version = "0.0.0"
description = "Framework-neutral core shared by AgentKit runtime adapters: the agent.yaml ABI loader, the OpenAI /v1 facade, the CLI/network posture, and the neutral run contract. Imports NO agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentKit" }]
# Framework-neutral tail ONLY. A runtime adapter adds its own framework deps
# (pydantic-ai, or agent-framework-*+mcp) on top of this. This package must never
# depend on an agent framework — that is what keeps the lock-in boundary (plan
# §12) inside each adapter's agent_factory.py.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.28",
    # Runtime wheels only; stub compiler pins live in scripts/ separately.
    "grpcio>=1.78.0,<2",
    "protobuf>=6.31.1,<7",
]

[project.scripts]
agentkit-brokered-tools = "agentkit_serve_common.brokered:main"
agentkit-foundry-brokered = "agentkit_serve_common.foundry_brokered_cli:main"
agentkit-foundry-conformance = "agentkit_serve_common.foundry_conformance:main"

[project.optional-dependencies]
foundry-conformance = ["azure-ai-agentserver-responses>=1.0.0b8,<2"]
# Starlette/FastAPI TestClient currently imports the httpx2 compatibility package.
# Keep the Foundry SDK here as well because the common test suite exercises the
# optional conformance app. Runtime adapter images install the base package only.
dev = ["pytest>=8.0", "httpx2>=0.1", "azure-ai-agentserver-responses>=1.0.0b8,<2"]

[tool.hatch.build.targets.wheel]
packages = ["agentkit_serve_common"]
