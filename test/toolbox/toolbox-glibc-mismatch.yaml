#syntax=ghcr.io/orka-agents/agentkit/agentkit:latest
# Debian 13's mawk needs GLIBC_2.38; Debian 12 has glibc 2.36, so
# `--target verify` must fail with the command, its output, and a hint.
apiVersion: v1alpha1
kind: Toolbox
metadata:
  name: agentkit-e2e-glibc
spec:
  tools:
    - name: trixie-awk
      source:
        image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
        path: /usr/bin/awk
  verify:
    runtimeImage: debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    commands:
      - trixie-awk 'BEGIN { print "awk ok" }'
