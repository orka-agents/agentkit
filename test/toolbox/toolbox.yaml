#syntax=ghcr.io/orka-agents/agentkit/agentkit:latest
# Exercises every tool source: a plain download (yq), one file extracted from an
# archive (helm), and a file copied from an image through an absolute symlink
# chain (/usr/bin/awk -> /etc/alternatives/awk -> /usr/bin/mawk).
# It is named trixie-awk because, as in Orka, system folders come first on
# PATH: a tool named awk would run the runtime image's own awk.
apiVersion: v1alpha1
kind: Toolbox
metadata:
  name: agentkit-e2e
  labels:
    com.example.purpose: e2e
spec:
  tools:
    - name: yq
      description: YAML processor
      source:
        download:
          linux/amd64: {url: https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64, sha256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f}
          linux/arm64: {url: https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_arm64, sha256: 189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b}
    - name: helm
      description: Kubernetes package manager
      source:
        download:
          linux/amd64: {url: https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz, sha256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496, extract: linux-amd64/helm}
          linux/arm64: {url: https://get.helm.sh/helm-v3.19.0-linux-arm64.tar.gz, sha256: 440cf7add0aee27ebc93fada965523c1dc2e0ab340d4348da2215737fc0d76ad, extract: linux-arm64/helm}
    - name: trixie-awk
      source:
        image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
        path: /usr/bin/awk
  verify:
    # Debian 13 has glibc 2.41, like Orka's runtime images.
    runtimeImage: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    commands:
      - yq --version
      - helm version --short
      - trixie-awk 'BEGIN { print "awk ok" }'
